import groovy.json.JsonSlurper

Properties identity = new Properties()
new File(project.ext.huskRoot, 'gradle.properties').withInputStream { InputStream stream -> identity.load(stream) }
Map<String, String> values = [:]
for (String key : ['projectId', 'projectName', 'projectGroup', 'projectVersion', 'minecraftVersion', 'volmLibVersion']) {
    values[key] = providers.gradleProperty(key).getOrElse(identity.getProperty(key))
    if (values[key] == null || values[key].isBlank()) {
        throw new GradleException("${key} must not be blank")
    }
}
if (!(values.projectId ==~ /[a-z][a-z0-9_]{1,63}/)) {
    throw new GradleException('projectId must contain 2–64 lowercase letters, digits or underscores, starting with a letter')
}
if (!(values.projectGroup ==~ /[a-zA-Z_][a-zA-Z0-9_]*(?:\.[a-zA-Z_][a-zA-Z0-9_]*)+/)) {
    throw new GradleException('projectGroup must be a dotted Java package name')
}
if (!(values.projectName ==~ /[A-Za-z][A-Za-z0-9_-]*/) || !(values.projectVersion ==~ /[0-9]+\.[0-9]+\.[0-9]+(?:[-+][A-Za-z0-9.-]+)?/)) {
    throw new GradleException('projectName must be an identifier and projectVersion must be a semantic version')
}
Map<String, Map<String, Object>> targets = (Map<String, Map<String, Object>>) new JsonSlurper().parse(new File(project.ext.huskRoot, 'gradle/targets.json'))
targets.each { String target, Map<String, Object> properties ->
    if (!(properties.forge instanceof String) || properties.forge.isBlank() || !properties.forgeLoaderRange) {
        throw new GradleException("Minecraft ${target} must declare Forge support")
    }
    if (!(properties.javaVersion in [17, 21, 25])) {
        throw new GradleException("Minecraft ${target} must declare its Java runtime version")
    }
    if (!(properties.forgeRuntimeMappings in ['srg', 'official'])) {
        throw new GradleException("Minecraft ${target} must declare its Forge runtime mappings")
    }
}
if (!targets.containsKey(values.minecraftVersion)) {
    throw new GradleException("Unsupported Minecraft target ${values.minecraftVersion}; choose ${targets.keySet().join(', ')}")
}
ext.husk = values
ext.minecraftTargets = targets
group = values.projectGroup
version = values.projectVersion
